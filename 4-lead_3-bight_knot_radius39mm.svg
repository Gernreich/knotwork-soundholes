<svg xmlns="http://www.w3.org/2000/svg"
     width="82mm" height="82mm" viewBox="-41 -41 82 82">
  <title>4-lead 3-bight knot sound hole - 39mm radius</title>
  <!-- 1 user unit = 1mm, so this prints/cuts at true size.
       Sound hole radius 39mm (78mm diameter).
       4-lead 3-bight knot: ONE self-crossing ribbon 5.2mm wide, 9 crossings.
       Single strand r = 28.15 + 9.75*cos(3*theta/4), theta in [0,8pi),
       winding twice before it closes.
       The ribbon overruns the rim by 1.5mm at 3 points, fusing it
       into the soundboard, so the rosette cannot drop out when cut.
       Open area 1844mm2 = 39% of a plain 78mm hole
       (acoustically equivalent to a plain round hole of
       48.5mm diameter).
       Narrowest cut region: 1.27mm across. -->


