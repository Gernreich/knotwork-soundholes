<svg xmlns="http://www.w3.org/2000/svg"
     width="64mm" height="64mm" viewBox="-32 -32 64 64">
  <title>3-lead 4-bight knot sound hole - 30mm radius</title>
  <!-- 1 user unit = 1mm, so this prints/cuts at true size.
       Sound hole radius 30mm (60mm diameter).
       3-lead 4-bight knot: ONE self-crossing ribbon 4mm wide, 8 crossings.
       Single strand r = 22.00 + 7.5*cos(4*theta/3), theta in [0,6pi),
       winding twice before it closes.
       The ribbon overruns the rim by 1.5mm at 4 points, fusing it
       into the soundboard, so the rosette cannot drop out when cut.
       Open area 1392mm2 = 49% of a plain 60mm hole
       (acoustically equivalent to a plain round hole of
       42.1mm diameter).
       Narrowest cut region: 2.07mm across. -->


