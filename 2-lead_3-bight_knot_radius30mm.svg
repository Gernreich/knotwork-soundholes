<svg xmlns="http://www.w3.org/2000/svg"
     width="64mm" height="64mm" viewBox="-32 -32 64 64">
  <title>2-lead 3-bight knot sound hole - 30mm radius</title>
  <!-- 1 user unit = 1mm, so this prints/cuts at true size.
       Sound hole radius 30mm (60mm diameter).
       2-lead 3-bight knot: ONE self-crossing ribbon 4mm wide, 3 crossings.
       Single strand r = 22.00 + 7.5*cos(3*theta/2), theta in [0,4pi),
       winding twice before it closes.
       The ribbon overruns the rim by 1.5mm at 3 points, fusing it
       into the soundboard, so the rosette cannot drop out when cut.
       Open area 1789mm2 = 63% of a plain 60mm hole
       (acoustically equivalent to a plain round hole of
       47.7mm diameter).
       Narrowest cut region: 5.51mm across. -->


