[package]
name = "knotwork-soundholes"
version = "0.1.0"
edition = "2021"
authors = ["Michael Gernreich", "Claude (Anthropic) <noreply@anthropic.com>"]
description = "Knotwork sound-hole generators: cut-ready SVG rosettes for laser-cut instruments"
license-file = "LICENSE"
publish = false
autobins = false

[lib]
name = "soundhole"
path = "src/lib.rs"

[[bin]]
name = "knot_soundhole"
path = "knot_soundhole.rs"

[[bin]]
name = "plait_soundhole"
path = "plait_soundhole.rs"

[[bin]]
name = "preview"
path = "preview.rs"

# The 3D page's builder. It reads the cut files with lasermade-tools' turn3d
# module, so it expects that checkout beside this one.
[[bin]]
name = "viewer"
path = "viewer.rs"

[dependencies]
lasermade-tools = { path = "../lasermade-tools" }

[profile.release]
overflow-checks = true
