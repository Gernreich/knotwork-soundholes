<svg xmlns="http://www.w3.org/2000/svg"
     width="64mm" height="64mm" viewBox="-32 -32 64 64">
  <title>10-crossing plait sound hole - 30mm radius</title>
  <!-- 1 user unit = 1mm, so this prints/cuts at true size.
       Sound hole radius 30mm (60mm diameter).
       Two interwoven ribbons 4mm wide, 10 crossings.
       The ribbon overruns the rim by 1.5mm at 10 points, fusing it
       into the soundboard, so the rosette cannot drop out when cut.
       Open area 1483mm2 = 52% of a plain 60mm hole
       (acoustically equivalent to a plain round hole of
       43.5mm diameter).
       Narrowest cut region: 3.10mm across. -->


