<svg xmlns="http://www.w3.org/2000/svg" width="64mm" height="64mm" viewBox="-32 -32 64 64">
  <title>2-lead 5-bight knot sound hole - 30mm radius — display only</title>
  <!-- DISPLAY ONLY - not a cut file. The cut layer of 2-lead_5-bight_knot_radius30mm.svg, filled even-odd.
       Deep gold is the rosette, pale gold the board it fuses into, white the waste
       that drops out. The ribbon overruns the rim by BITE (1.5mm here) and becomes
       board, so the two golds part at r=31.5mm with the ribbon running straight on
       through - bounding the fill at R_HOLE instead sliced every lobe tip flat along a
       circle and showed a rosette that does not exist. The white is painted, not
       transparent, so the picture reads the same on a light or a dark page.
       Cut files carry no fill; browsing one shows a transparency checkerboard. -->
  <defs><clipPath id="rosette"><circle cx="0" cy="0" r="31.5"/></clipPath></defs>
