<svg xmlns="http://www.w3.org/2000/svg"
     width="64mm" height="64mm" viewBox="-32 -32 64 64">
  <title>3-lead 2-bight knot sound hole - 30mm radius</title>
  <!-- 1 user unit = 1mm, so this prints/cuts at true size.
       Sound hole radius 30mm (60mm diameter).
       3-lead 2-bight knot: ONE self-crossing ribbon 4mm wide, 4 crossings.
       Single strand r = 22.00 + 7.5*cos(2*theta/3), theta in [0,6pi),
       winding twice before it closes.
       The ribbon overruns the rim by 1.5mm at 2 points, fusing it
       into the soundboard, so the rosette cannot drop out when cut.
       Open area 1433mm2 = 51% of a plain 60mm hole
       (acoustically equivalent to a plain round hole of
       42.7mm diameter).
       Narrowest cut region: 2.21mm across. -->


