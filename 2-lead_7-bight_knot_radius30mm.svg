<svg xmlns="http://www.w3.org/2000/svg"
     width="64mm" height="64mm" viewBox="-32 -32 64 64">
  <title>2-lead 7-bight knot sound hole - 30mm radius</title>
  <!-- 1 user unit = 1mm, so this prints/cuts at true size.
       Sound hole radius 30mm (60mm diameter).
       2-lead 7-bight knot: ONE self-crossing ribbon 4mm wide, 7 crossings.
       Single strand r = 22.00 + 7.5*cos(7*theta/2), theta in [0,4pi),
       winding twice before it closes.
       The ribbon overruns the rim by 1.5mm at 7 points, fusing it
       into the soundboard, so the rosette cannot drop out when cut.
       Open area 1591mm2 = 56% of a plain 60mm hole
       (acoustically equivalent to a plain round hole of
       45.0mm diameter).
       Narrowest cut region: 4.30mm across. -->


