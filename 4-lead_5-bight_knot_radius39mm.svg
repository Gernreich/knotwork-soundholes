<svg xmlns="http://www.w3.org/2000/svg"
     width="82mm" height="82mm" viewBox="-41 -41 82 82">
  <title>4-lead 5-bight knot sound hole - 39mm radius</title>
  <!-- 1 user unit = 1mm, so this prints/cuts at true size.
       Sound hole radius 39mm (78mm diameter).
       4-lead 5-bight knot: ONE self-crossing ribbon 5.2mm wide, 15 crossings.
       Single strand r = 28.15 + 9.75*cos(5*theta/4), theta in [0,8pi),
       winding twice before it closes.
       The ribbon overruns the rim by 1.5mm at 5 points, fusing it
       into the soundboard, so the rosette cannot drop out when cut.
       Open area 1784mm2 = 37% of a plain 78mm hole
       (acoustically equivalent to a plain round hole of
       47.7mm diameter).
       Narrowest cut region: 1.25mm across. -->


